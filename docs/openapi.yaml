openapi: 3.1.0
info:
  title: HookRelay API
  version: 0.1.0
  description: Multi-tenant outbound webhook delivery platform API.

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /healthz:
    get:
      summary: Liveness probe
      description: Returns 200 if the process is alive.
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"

  /readyz:
    get:
      summary: Readiness probe
      description: Verifies connectivity to PostgreSQL, Redis, and RabbitMQ.
      responses:
        "200":
          description: All dependencies are healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependencies are degraded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/admin/tenants:
    post:
      summary: Bootstrap tenant
      description: Creates a new tenant and generates its initial root API key. Protected by ADMIN_TOKEN.
      security:
        - AdminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        "201":
          description: Tenant created successfully. Initial API key returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantResponse"
        "400":
          description: Validation error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Missing or invalid admin bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "503":
          description: Admin API disabled (ADMIN_TOKEN not configured).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/api-keys:
    get:
      summary: List API keys
      description: Lists active and revoked API keys for the authenticated tenant. Never returns secrets.
      security:
        - TenantApiKeyAuth: []
      responses:
        "200":
          description: List of API keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          description: Invalid or revoked API key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      summary: Create API key
      description: Generates a new API key for the authenticated tenant. The secret is returned ONCE.
      security:
        - TenantApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: API key created. Secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApiKeyResponse"
        "400":
          description: Validation error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Active key quota reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/api-keys/{id}:
    delete:
      summary: Revoke API key
      description: Revokes an API key. Rejects revoking the last active key unless force=true is passed.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "204":
          description: Key revoked successfully.
        "400":
          description: Validation error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Key not found under authenticated tenant.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Cannot revoke last active key without force=true.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints:
    get:
      summary: List endpoints
      description: Returns a keyset-paginated list of endpoints for the tenant.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, paused, disabled]
      responses:
        "200":
          description: Endpoints list with opaque next_cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointListResponse"
        "400":
          description: Invalid cursor or query parameters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    post:
      summary: Create endpoint
      description: Registers a new webhook delivery destination. Generates a signing secret returned strictly once.
      security:
        - TenantApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "201":
          description: Endpoint created. Signing secret returned once.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateEndpointResponse"
        "400":
          description: Validation or SSRF rejection error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Tenant endpoint quota reached (max 50).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints/{id}:
    get:
      summary: Get endpoint
      description: Returns endpoint metadata. Never returns signing secrets.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endpoint details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found or deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    patch:
      summary: Update endpoint
      description: Updates URL, description, or concurrency limit with optimistic locking.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchEndpointRequest"
      responses:
        "200":
          description: Endpoint updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          description: Validation error or mismatched versions.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Optimistic lock version conflict.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    delete:
      summary: Delete endpoint
      description: Soft deletes an endpoint and scrubs all secrets. Non-idempotent.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Endpoint soft deleted.
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found or already deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints/{id}/pause:
    post:
      summary: Pause endpoint
      description: Pauses webhook deliveries to this endpoint. Idempotent.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endpoint paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints/{id}/resume:
    post:
      summary: Resume endpoint
      description: Resumes webhook deliveries to this endpoint. Idempotent.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Endpoint resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints/{id}/rotate-secret:
    post:
      summary: Rotate signing secret
      description: Generates a new signing secret returned once, moving the old secret to previous_secret with an expiration grace period.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Secret rotated. New secret returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateSecretResponse"
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /v1/endpoints/{id}/subscriptions:
    get:
      summary: Get subscriptions
      description: Returns the active event type subscriptions for the endpoint.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Active subscriptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionsResponse"
        "400":
          description: Invalid UUID format.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
    put:
      summary: Replace subscriptions
      description: Atomically replaces the endpoint's event subscriptions. Supports wildcard '*' or a list of specific event types.
      security:
        - TenantApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionsRequest"
      responses:
        "200":
          description: Subscriptions replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionsResponse"
        "400":
          description: Validation error or wildcard mixed with specific types.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Endpoint not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  securitySchemes:
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: Root administration token configured via ADMIN_TOKEN.
    TenantApiKeyAuth:
      type: http
      scheme: bearer
      description: Tenant API key in the format hr_live_<prefix>_<secret>.

  schemas:
    LivenessResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ReadinessResponse:
      type: object
      required:
        - status
        - checks
        - timestamp
      properties:
        status:
          type: string
          example: ready
        checks:
          type: object
          properties:
            postgres:
              type: string
              example: ok
            redis:
              type: string
              example: ok
            rabbitmq:
              type: string
              example: ok
        timestamp:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: urn:hookrelay:problem:validation-error
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request payload.
        instance:
          type: string
          example: /v1/endpoints
        request_id:
          type: string
        invalidParams:
          type: array
          items:
            type: object
            required:
              - name
              - reason
            properties:
              name:
                type: string
              reason:
                type: string

    CreateTenantRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 128

    CreateTenantResponse:
      type: object
      required:
        - tenant
        - api_key
      properties:
        tenant:
          type: object
          required:
            - id
            - name
            - created_at
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            created_at:
              type: string
              format: date-time
        api_key:
          type: object
          required:
            - id
            - name
            - prefix
            - key
            - created_at
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            prefix:
              type: string
            key:
              type: string
            created_at:
              type: string
              format: date-time

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 128

    CreateApiKeyResponse:
      type: object
      required:
        - id
        - name
        - prefix
        - key
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        key:
          type: string
        created_at:
          type: string
          format: date-time

    ApiKeyListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - prefix
              - created_at
              - revoked_at
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              prefix:
                type: string
              last_used_at:
                type: string
                format: date-time
                nullable: true
              created_at:
                type: string
                format: date-time
              revoked_at:
                type: string
                format: date-time
                nullable: true

    Endpoint:
      type: object
      required:
        - id
        - url
        - status
        - concurrency_limit
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [active, paused, disabled]
        description:
          type: string
          nullable: true
        concurrency_limit:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    CreateEndpointRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
          maxLength: 500
        concurrency_limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10

    CreateEndpointResponse:
      allOf:
        - $ref: "#/components/schemas/Endpoint"
        - type: object
          required:
            - signing_secret
          properties:
            signing_secret:
              type: string
              example: whsec_...

    PatchEndpointRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        description:
          type: string
          maxLength: 500
          nullable: true
        concurrency_limit:
          type: integer
          minimum: 1
          maximum: 100
        version:
          type: integer

    EndpointListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
        pagination:
          type: object
          required:
            - limit
            - has_more
            - next_cursor
          properties:
            limit:
              type: integer
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true

    RotateSecretResponse:
      type: object
      required:
        - endpoint_id
        - signing_secret
        - previous_secret_expires_at
        - version
      properties:
        endpoint_id:
          type: string
          format: uuid
        signing_secret:
          type: string
          example: whsec_...
        previous_secret_expires_at:
          type: string
          format: date-time
        version:
          type: integer

    SubscriptionsRequest:
      type: object
      required:
        - event_types
      properties:
        event_types:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 128

    SubscriptionsResponse:
      type: object
      required:
        - event_types
      properties:
        event_types:
          type: array
          items:
            type: string
